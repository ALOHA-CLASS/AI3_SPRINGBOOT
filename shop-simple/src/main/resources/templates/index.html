<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main_layout}">
<head>
    <title>HOME</title>
</head>
<body>
<div layout:fragment="content">

    <!-- 비주얼 배너 -->
    <section class="visual">
        <div class="visual-text">
            <span class="sec-label">2026 NEW ARRIVAL</span>
            <h2 class="visual-title">심플하게, <b>ALOHA STORE</b></h2>
            <p class="visual-desc">데일리로 즐기는 감각적인 라이프스타일 아이템</p>
            <a th:href="@{/products}" class="btn-fill big">지금 쇼핑하기</a>
        </div>
    </section>

    <!-- 신상품 -->
    <section class="section">
        <div class="sec-head">
            <span class="sec-label">NEW ITEMS</span>
            <h2 class="sec-title">신상품 <b>추천</b></h2>
        </div>

        <ul class="product-grid">
            <li class="product-card" th:each="p : ${products}">
                <a th:href="@{/products/{no}(no=${p.no})}">
                    <div class="thumb">
                        <img th:src="${p.imageUrl}" th:alt="${p.name}">
                    </div>
                    <div class="info">
                        <span class="cate" th:text="${p.category}">카테고리</span>
                        <p class="name" th:text="${p.name}">상품명</p>
                        <p class="price"><b th:text="${#numbers.formatInteger(p.price, 0, 'COMMA')}">0</b>원</p>
                    </div>
                </a>
            </li>
            <li th:if="${#lists.isEmpty(products)}" class="empty">등록된 상품이 없습니다.</li>
        </ul>

        <div class="center">
            <a th:href="@{/products}" class="btn-line">전체 상품 보기</a>
        </div>
    </section>

</div>
</body>
</html>
