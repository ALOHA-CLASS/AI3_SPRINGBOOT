<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main_layout}">
<head>
    <title th:text="${product.name}">상품 상세</title>
</head>
<body>
<div layout:fragment="content">

    <div class="detail">
        <div class="detail-thumb">
            <img th:src="${product.imageUrl}" th:alt="${product.name}">
        </div>
        <div class="detail-info">
            <span class="cate" th:text="${product.category}">카테고리</span>
            <h2 class="detail-name" th:text="${product.name}">상품명</h2>
            <p class="detail-price"><b th:text="${#numbers.formatInteger(product.price, 0, 'COMMA')}">0</b>원</p>
            <p class="detail-desc" th:text="${product.description}">설명</p>
            <p class="detail-stock">재고 : <span th:text="${product.stock}">0</span>개</p>

            <!-- 로그인 사용자만 담기 가능 -->
            <div sec:authorize="isAuthenticated()">
                <form th:action="@{/cart/add}" method="post" class="buy-form js-add-form">
                    <input type="hidden" name="productNo" th:value="${product.no}">
                    <label>수량
                        <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}">
                    </label>
                    <button type="submit" class="btn-line big">장바구니 담기</button>
                    <button type="submit" formmethod="get" th:formaction="@{/orders/checkout/direct}" class="btn-fill big">바로 주문하기</button>
                </form>
            </div>
            <div sec:authorize="isAnonymous()">
                <a th:href="@{/users/login}" class="btn-line">로그인 후 구매하기</a>
            </div>

            <a th:href="@{/products}" class="link-back">← 목록으로</a>
        </div>
    </div>

</div>
</body>
</html>
